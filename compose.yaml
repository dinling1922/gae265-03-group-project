name: gae265_03_group_project

# worker、beat、Flower 共用 backend 的 image 與設定（ADR-0028）
x-celery-common: &celery-common
  image: gae265_03_group_project-backend
  # 和 backend 同一份 build 設定：image 還不存在時不會去 Docker Hub 拉，build cache 共用
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: dev
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    POSTGRES_SERVER: db
    POSTGRES_PORT: 5432
    REDIS_URL: redis://redis:6379/0
    # .env 沒設時寄到 compose 的 Mailpit
    SMTP_HOST: ${SMTP_HOST:-mailpit}
    SMTP_PORT: ${SMTP_PORT:-1025}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    # backend 啟動時會套用 migration，等它好了才開始處理工作
    backend:
      condition: service_healthy
  develop:
    watch:
      - action: sync+restart
        path: ./backend/app
        target: /app/backend/app
        ignore:
          - __pycache__/

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gae265_03_group_project}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-gae265_03_group_project_test}
    volumes:
      - db-data:/var/lib/postgresql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9.18.0
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # desktop 模式：不需登入、不需 master password
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_ENABLE_SERVER_PASS_EXEC_CMD: "True"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      # 帳密寫死 postgres／postgres；改了 POSTGRES_USER、POSTGRES_PASSWORD 要一起改
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      # desktop 模式免登入，只綁本機
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: gae265_03_group_project-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      # 容器內連本機的 Ollama；Linux（含 WSL2）需要 extra_hosts 才有 host.docker.internal
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app/backend
          ignore:
            - .venv/
            - __pycache__/
            - .pytest_cache/
            - .ruff_cache/
            - tests/
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./uv.lock

  # 背景工作（ADR-0028）：Redis 只當佇列，不保存資料；狀態都在 Postgres
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    <<: *celery-common
    command: ["celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  beat:
    <<: *celery-common
    # 排程檔放 /tmp：不寫進同步的程式碼資料夾
    command: ["celery", "-A", "app.worker:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]

  flower:
    <<: *celery-common
    command: ["celery", "-A", "app.worker:celery_app", "flower", "--port=5555"]
    ports:
      - "127.0.0.1:${FLOWER_PORT:-5555}:5555"

  # 開發用收信匣：提醒信寄到這裡，不會真的寄出；http://localhost:8025 看信
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  frontend:
    image: gae265_03_group_project-frontend
    build: ./docker/frontend
    restart: unless-stopped
    command: pnpm dev
    environment:
      API_PROXY_TARGET: http://backend:8000
      # pnpm 預設在跑 script 前發現 node_modules 不是自己裝的就重裝，
      # 容器裡重裝會把本機（macOS）的原生套件刪掉；依賴只由本機 make install 安裝
      pnpm_config_verify_deps_before_run: "false"
    volumes:
      # node_modules 跟著一起掛進來，本機與容器共用一份（Linux 原生套件見 frontend/pnpm-workspace.yaml）
      - ./frontend:/app/frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

volumes:
  db-data:
  pgadmin-data:
